# Jazzy rcl rejects heterogeneous YAML sequences (message_value lists of maps).
# Keep mappings flat / homogeneous so --params-file parses cleanly.
joy_teleop:
  ros__parameters:
    # Hold Left Bumper (button 6) to drive — same as physical robot
    human_control:
      type: topic
      message_type: ackermann_msgs/msg/AckermannDriveStamped
      topic_name: /ackermann_cmd
      deadman_buttons: [6]
      axis_mappings:
        drive.speed:
          axis: 1
          scale: 1.0
          offset: 0.0
        drive.steering_angle:
          axis: 2
          scale: 0.34
          offset: 0.0
